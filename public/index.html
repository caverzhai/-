<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>人人帮 - 链上互助社交</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <header class="navbar">
      <div class="nav-brand" onclick="navigate('home')">人人帮</div>
      <nav class="nav-links">
        <a onclick="navigate('home')" data-nav="home">首页</a>
        <a onclick="navigate('my')" data-nav="my">我的</a>
        <a onclick="navigate('share')" data-nav="share">分享</a>
      </nav>
    </header>

    <!-- 首页 -->
    <section id="page-home" class="page active">
      <div class="hero">
        <div class="hero-icon">🤝</div>
        <h1>人人帮</h1>
        <p class="hero-sub">互助社交 · 公平分配 · 全球互联</p>
      </div>

      <div class="card intro-card">
        <h3>平台简介</h3>
        <p>人人帮起始于2019年，2026年推出全新互助模式。通过有偿捐助与制度公平分配，帮助更多人减轻压力，获得美好生活。</p>
        <ul class="feature-list">
          <li>✅ 无区域限制，全球同步</li>
          <li>✅ 制度公开，分配透明</li>
          <li>✅ 平台不赚钱，全额分配</li>
        </ul>
      </div>

      <div class="card rules-card">
        <h3>互助卡分配规则</h3>
        <div class="rule-item">
          <span class="rule-tag">A</span>
          <span>直推人获得 <b>20</b> U</span>
        </div>
        <div class="rule-item">
          <span class="rule-tag">B</span>
          <span>向上最多4个V9会员，各 <b>40</b> U</span>
        </div>
        <div class="rule-item">
          <span class="rule-tag">C</span>
          <span>剩余金额向上分配给普通会员，各 <b>20</b> U</span>
        </div>
      </div>

      <div class="card v9-card">
        <h3>V9会员条件</h3>
        <div class="v9-condition">
          <div class="v9-item">① 直推会员 ≥ 3人</div>
          <div class="v9-item">② 团队总人数 > 80人</div>
          <div class="v9-item">③ 送出感恩卡（300U）给直推人</div>
        </div>
      </div>

      <div id="home-action" class="action-area">
        <!-- 动态渲染：连接钱包 / 购买互助卡 / 已会员 -->
      </div>
    </section>

    <!-- 我的 -->
    <section id="page-my" class="page">
      <div id="my-content">
        <!-- 动态渲染 -->
      </div>
    </section>

    <!-- 分享 -->
    <section id="page-share" class="page">
      <div id="share-content">
        <!-- 动态渲染 -->
      </div>
    </section>

    <!-- 资料编辑弹窗 -->
    <div id="profile-modal" class="modal-overlay" onclick="closeProfileModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>编辑资料</h3>
        <div class="form-group">
          <label>昵称</label>
          <input type="text" id="edit-nickname" maxlength="20" placeholder="输入昵称">
        </div>
        <div class="form-group">
          <label>头像</label>
          <div class="avatar-grid" id="avatar-grid"></div>
        </div>
        <div class="form-group">
          <label>手机号码（选填）</label>
          <input type="tel" id="edit-phone" maxlength="11" placeholder="输入手机号码">
        </div>
        <div class="form-group">
          <label>我的业绩目标（U）</label>
          <input type="number" id="edit-debt" min="0" placeholder="0">
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeProfileModal()">取消</button>
          <button class="btn btn-primary" onclick="saveProfile()">保存</button>
        </div>
      </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
